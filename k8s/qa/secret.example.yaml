# Plantilla del Secret de RabbitMQ (qa). Copiar a secret.yaml (NO se sube a git: está en .gitignore),
# poner los valores en base64 y aplicar con: kubectl apply -f k8s/qa/secret.yaml
# Para codificar:  printf '%s' 'valor' | base64
# Para cambiar la contraseña de un Rabbit que ya corre, ver SEGURIDAD_CREDENCIALES_2026-10-15.md (Paso B).
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: qa
type: Opaque
data:
  username: <BASE64_DEL_USUARIO>
  password: <BASE64_DE_LA_PASSWORD>
