# PROPUESTA — regla para el nginx que sirve la tienda (front). NO se aplica sola; probar con `nginx -t` antes de recargar.
# Manda SOLO a los rastreadores de WhatsApp/Facebook/Twitter a la vista previa del back; las personas siguen viendo la SPA.
#
# 1) En el contexto http { } (por ejemplo un archivo en conf.d/, FUERA de server { }):
map $http_user_agent $es_rastreador {
    default 0;
    "~*(facebookexternalhit|WhatsApp|Twitterbot|TelegramBot|LinkedInBot|Slackbot)" 1;
}

