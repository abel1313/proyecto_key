# PROPUESTA — para activarla se copia a .github/workflows/seguridad.yml
# CodeQL lee el código buscando errores peligrosos; Trivy (modo fs) revisa las librerías del repositorio. Para revisar la IMAGEN
# del contenedor hay que agregar otro paso con `scan-type: image` después de construirla. Antes de activar: fijar las acciones
# por SHA de commit (no por etiqueta) para no depender de que la etiqueta no cambie.
# Confirmar antes si el repositorio es público o privado: en privados CodeQL puede requerir GitHub Advanced Security.
name: seguridad
on:
  pull_request:
  schedule: [{ cron: "0 9 * * 1" }]   # cada lunes
permissions:
  contents: read
  security-events: write
jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: github/codeql-action/init@v3
        with: { languages: java-kotlin }
      - run: mvn -q -DskipTests package
      - uses: github/codeql-action/analyze@v3
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "0"        # solo avisa; cambiar a "1" cuando ya no haya pendientes
