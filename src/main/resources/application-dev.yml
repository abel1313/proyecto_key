
server:
  port: 9091
  servlet:
    context-path: /mis-productos
---

spring:
  codec:
    max-in-memory-size: 10MB
  cache:
    #type: redis
    type: simple
  redis:
    host: 127.0.0.1
    port: 6379
  config:
    activate:
      on-profile: dev
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000         # 1 min: libera conexiones idle rápido en VPS con poca RAM
      max-lifetime: 300000        # 5 min: rota conexiones antes de que MySQL las corte
      connection-timeout: 20000   # 20 seg: tiempo máximo esperando una conexión del pool
      keepalive-time: 30000       # 30 seg: ping para mantener la conexión viva
      connection-test-query: SELECT 1
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: mail.novedades-jade.com.mx
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # Sin estos tiempos un SMTP colgado dejaba esperando al hilo para siempre (hallazgo del revisor, 2026-11-27).
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

clave-seguridad:
