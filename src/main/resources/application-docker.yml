
server:
  port: 9010
  servlet:
    context-path: /mis-productos

---

spring:
  codec:
    max-in-memory-size: 10MB
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${SPRING_DB_NAME}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 20000
      keepalive-time: 30000
      connection-test-query: SELECT 1
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cache:
    type: redis
  redis:
    host: redis
    port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  mail:
    # Antes usaba smtp.gmail.com con la cuenta gmail personal del dueno como remitente (encontrado
    # 2026-09-06: el correo de verificacion llegaba con esa direccion, no con un correo del
    # negocio). Se cambia al buzon real del negocio en hosting-mexico -- mismo servidor/protocolo
    # que ya usa QA (application-qa.yml), solo cambia la cuenta (admin@ en vez de qa.boutique.bolsas@).
    host: hapi.hosting-mexico.net
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

clave-seguridad:
  clave: ${TOKEN_JWT}

seguridad:
  # El front de produccion (master, TokenInterceptor) ya manda X-Requested-With en /auth/refresh y /auth/logout:
  # sin este header se rechaza con 403 (otro sitio ya no puede forzar un logout ni un refresh).
  exigir-header-refresh: true
  cors:
    # Solo dominios HTTPS de produccion. Se quitaron los dos origenes HTTP planos de desarrollo
    # (localhost:4200 y 51.178.29.99:30001) y el de QA, que antes quedaban habilitados aqui
    # porque la lista estaba hardcodeada en SecurityConfig y era la misma para todos los perfiles.
    origenes-permitidos: https://shop.novedades-jade.com.mx,https://front.novedades-jade.com.mx,https://novedades-jade.com.mx,https://www.novedades-jade.com.mx

cookie:
  secure: true

api:
  imagenes: ${ENDPOINT_IMAGENES}
  cors_angular: https://shop.novedades-jade.com.mx

management:
  endpoints:
    web:
      exposure:
        include: caches,health

guardar-imagenes:
  ruta_imagenes: /app/imagenes

# URL pública real de este backend -- la usa EmailService para armar el <img> del logo en el
# encabezado de los correos (ver LOGOS_DEPLOY.md, feature de Logos). Se agrega el valor acá de
# una vez aunque el resto de la feature (Logo/LogoService/LogoController) todavía no esté en esta
# rama -- si la clave no la usa ningún @Value todavía, Spring simplemente la ignora, no rompe
# nada. Cuando se promueva la feature completa a main no va a hacer falta tocar este archivo de
# nuevo.
app:
  public-base-url: https://backend.novedades-jade.com.mx/mis-productos

springdoc:
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  api-docs:
    enabled: false
    path: /v3/api-docs

reconciliacion:
  admin-username: ${RECONCILIACION_ADMIN_USERNAME:}
  admin-password: ${RECONCILIACION_ADMIN_PASSWORD:}
#logging:
#  level:
#    org.hibernate.SQL: DEBUG
#    org.hibernate.orm.jdbc.bind: TRACE

#logging:
#  level:
#    root: INFO
#    com.miempresa: DEBUG

redis:
  dns: redis

mercadopago:
  access-token: ${ACCESS_TOKE_MERCADO_PAGO}
  device-id: ${DEVICE_ID}
  sandbox: false

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  sistema: "Eres un asistente de la tienda Novedades Jade. Responde de manera amable y concisa sobre nuestros productos, precios y pedidos. Si no sabes algo, dilo honestamente."

chat:
  admin-email: ${CHAT_ADMIN_EMAIL:admin@novedades-jade.com.mx}

whatsapp:
  proveedor: ${WHATSAPP_PROVEEDOR:callmebot}
  callmebot-apikey: ${WHATSAPP_APIKEY:}
  country-code: ${WHATSAPP_COUNTRY_CODE:52}

  # ── API de WhatsApp de Meta (Cloud API). Todo sale de variables de entorno: NUNCA van en el código ni en el chat.
  # Dónde se obtiene cada una: WHATSAPP_CLOUD_API.md
  cloud:
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    token: ${WHATSAPP_CLOUD_TOKEN:}
    # Si la app de Meta es la misma de Facebook/Instagram, basta con FACEBOOK_APP_SECRET.
    app-secret: ${WHATSAPP_APP_SECRET:${FACEBOOK_APP_SECRET:}}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    # Meta cambia la versión de la Graph API: confirmar la vigente en su documentación oficial.
    api-version: ${WHATSAPP_API_VERSION:v26.0}
    # Poner en true SOLO cuando Meta ya tenga un método de pago válido (Billing Hub) y plantillas aprobadas.
    metodo-pago-activo: ${WHATSAPP_METODO_PAGO_ACTIVO:false}
  bot:
    # Cuánto se aparta el bot después de que una persona contesta (se reinicia con cada respuesta suya).
    pausa-minutos: ${WHATSAPP_BOT_PAUSA_MINUTOS:30}
    # Fase 2: que el bot tome pedidos (Apartado). Apagado por defecto: se prende primero en QA.
    pedidos-habilitado: ${WHATSAPP_BOT_PEDIDOS_HABILITADO:false}
    # Cuenta que figura como «vendedor» del pedido. 0 = la primera cuenta ROLE_ADMIN activa.
    usuario-id: ${WHATSAPP_BOT_USUARIO_ID:0}
    # Tope de Apartados abiertos (no cancelados, no entregados) por número de WhatsApp. 0 = SIN tope.
    # ❓ Pendiente de decidir por el dueño; se recomienda 3 (ver PLAN_WHATSAPP_BOT.md).
    max-apartados-abiertos: ${WHATSAPP_BOT_MAX_APARTADOS_ABIERTOS:0}

facebook:
  page-id: ${FACEBOOK_PAGE_ID:}
  page-access-token: ${FACEBOOK_PAGE_ACCESS_TOKEN:}
  app-secret: ${FACEBOOK_APP_SECRET:}
  webhook-verify-token: ${FACEBOOK_WEBHOOK_VERIFY_TOKEN:}
  api-version: v21.0

instagram:
  account-id: ${INSTAGRAM_ACCOUNT_ID:}

tiktok:
  client-key: ${TIKTOK_CLIENT_KEY:}
  client-secret: ${TIKTOK_CLIENT_SECRET:}



