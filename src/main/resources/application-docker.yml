
server:
  port: 9010
  servlet:
    context-path: /mis-productos

---

spring:
  codec:
    max-in-memory-size: 10MB
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${SPRING_DB_NAME}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 20000
      keepalive-time: 30000
      connection-test-query: SELECT 1
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cache:
    type: redis
  redis:
    host: redis
    port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

clave-seguridad:
  clave: ${TOKEN_JWT}

seguridad:
  cors:
    # Solo dominios HTTPS de produccion. Se quitaron los dos origenes HTTP planos de desarrollo
    # (localhost:4200 y 51.178.29.99:30001) y el de QA, que antes quedaban habilitados aqui
    # porque la lista estaba hardcodeada en SecurityConfig y era la misma para todos los perfiles.
    origenes-permitidos: https://shop.novedades-jade.com.mx,https://front.novedades-jade.com.mx,https://novedades-jade.com.mx,https://www.novedades-jade.com.mx,https://venta-bolsas-online.netlify.app

cookie:
  secure: true

api:
  imagenes: ${ENDPOINT_IMAGENES}
  cors_angular: https://shop.novedades-jade.com.mx

management:
  endpoints:
    web:
      exposure:
        include: caches,health

guardar-imagenes:
  ruta_imagenes: /app/imagenes

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

reconciliacion:
  admin-username: ${RECONCILIACION_ADMIN_USERNAME:}
  admin-password: ${RECONCILIACION_ADMIN_PASSWORD:}
#logging:
#  level:
#    org.hibernate.SQL: DEBUG
#    org.hibernate.orm.jdbc.bind: TRACE

#logging:
#  level:
#    root: INFO
#    com.miempresa: DEBUG

redis:
  dns: redis

mercadopago:
  access-token: ${ACCESS_TOKE_MERCADO_PAGO}
  device-id: ${DEVICE_ID}
  sandbox: false

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  sistema: "Eres un asistente de la tienda Novedades Jade. Responde de manera amable y concisa sobre nuestros productos, precios y pedidos. Si no sabes algo, dilo honestamente."

chat:
  admin-email: ${CHAT_ADMIN_EMAIL:admin@novedades-jade.com.mx}

whatsapp:
  proveedor: ${WHATSAPP_PROVEEDOR:callmebot}
  callmebot-apikey: ${WHATSAPP_APIKEY:}
  country-code: ${WHATSAPP_COUNTRY_CODE:52}

facebook:
  page-id: ${FACEBOOK_PAGE_ID:}
  page-access-token: ${FACEBOOK_PAGE_ACCESS_TOKEN:}
  api-version: v21.0




