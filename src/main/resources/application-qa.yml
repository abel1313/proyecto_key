
server:
  port: 9011
  servlet:
    context-path: /mis-productos

---

spring:
  codec:
    max-in-memory-size: 10MB
  config:
    activate:
      on-profile: qa
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${SPRING_DB_NAME}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 20000
      keepalive-time: 30000
      connection-test-query: SELECT 1
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cache:
    type: redis
  redis:
    host: redis
    port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
  mail:
    # Causa real (2026-08-16, ticket 551620): mail.novedades-jade.com.mx estaba mal apuntado a
    # una IP ajena (75.2.60.5), nunca fue bloqueo de firewall. Hosting-Mexico ya corrigio el MX
    # (-> hapi.hosting-mexico.net, 63.143.40.210) pero el subdominio "mail." aun no propaga, asi
    # que se usa el hostname real del servidor de forma temporal para poder probar ya mismo.
    # Cuando mail.novedades-jade.com.mx resuelva a 63.143.40.210 (verificar con nslookup), se
    # puede volver a ese hostname sin cambiar nada mas (puerto/SSL quedan igual).
    host: hapi.hosting-mexico.net
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

clave-seguridad:
  clave: ${TOKEN_JWT}

seguridad:
  # Desactivado en QA para no bloquearse durante pruebas manuales repetidas de login/registro.
  # dev y prod NO tienen esta propiedad, asi que ahi el rate-limit sigue activo por default (true).
  #
  # OJO (hallazgo 16, SEGURIDAD_AUTH.md): QA esta publicado en internet, asi que mientras esto
  # este en false la fuerza bruta de login ahi es libre. Se dejo apagado a proposito para poder
  # probar comodo; al terminar la tanda de correcciones de seguridad hay que quitarlo.
  # Consecuencia a tener presente: el camino del 429 NO se ejercita en QA, se estrena en prod.
  rate-limit-habilitado: false
  cors:
    origenes-permitidos: https://qa.shop.novedades-jade.com.mx,https://venta-bolsas-online.netlify.app

cookie:
  secure: true

api:
  imagenes: ${ENDPOINT_IMAGENES}
  cors_angular: https://qa.shop.novedades-jade.com.mx

management:
  endpoints:
    web:
      exposure:
        include: caches,health

guardar-imagenes:
  ruta_imagenes: /app/imagenes

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

reconciliacion:
  admin-username: ${RECONCILIACION_ADMIN_USERNAME:}
  admin-password: ${RECONCILIACION_ADMIN_PASSWORD:}

mercadopago:
  access-token: ${ACCESS_TOKE_MERCADO_PAGO}
  device-id: ${DEVICE_ID}
  sandbox: true

redis:
  dns: redis

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  sistema: "Eres un asistente de la tienda Novedades Jade. Responde de manera amable y concisa sobre nuestros productos, precios y pedidos. Si no sabes algo, dilo honestamente."

chat:
  admin-email: ${CHAT_ADMIN_EMAIL:admin@novedades-jade.com.mx}

whatsapp:
  proveedor: ${WHATSAPP_PROVEEDOR:callmebot}
  callmebot-apikey: ${WHATSAPP_APIKEY:}
  country-code: ${WHATSAPP_COUNTRY_CODE:52}

facebook:
  page-id: ${FACEBOOK_PAGE_ID:}
  page-access-token: ${FACEBOOK_PAGE_ACCESS_TOKEN:}
  api-version: v21.0

