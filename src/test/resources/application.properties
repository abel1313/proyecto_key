# Configuracion SOLO para tests (@DataJpaTest/@SpringBootTest) -- NO se usa en dev/qa/prod, esos
# siguen leyendo application-{perfil}.yml como siempre.
#
# El perfil "dev" (activo por defecto, ver application.yml) exige SPRING_DATASOURCE_URL/USERNAME/
# PASSWORD sin valor por defecto -- sin este archivo, cualquier test que levante contexto de Spring
# fallaba al arrancar por esas variables faltantes, antes de llegar siquiera a @DataJpaTest. Se usa
# el perfil "test" (ver @ActiveProfiles("test") en los tests de repository) para no heredar nada de
# "dev": BD H2 en memoria, con MODE=MySQL para que las mismas queries/columnas se comporten igual
# que en MySQL real. Se recrea el esquema en cada test (create-drop) a partir de las entidades --
# no corre las migraciones .sql de la raiz del proyecto (esas son solo para MySQL real).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
